name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Rebuild a throwaway Supabase from migrations
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Fail if the database differs from the migrations
        run: |
          diff="$(npx supabase db diff --local --schema public)"
          if [ -n "$diff" ]; then echo "$diff"; exit 1; fi
      - name: Use the throwaway database's disposable keys
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/status.env"
          echo "Available names:" $(cut -d= -f1 "$RUNNER_TEMP/status.env")
          set -a; . "$RUNNER_TEMP/status.env"; set +a
          set -u
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npm run check:browser-files
      - run: npm run seed -- --target ci
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SMOKE_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Stop before changing anything if a setting is missing
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_PROJECT_REF SMOKE_URL; do
            if [ -z "${!name}" ]; then echo "Missing setting for $name"; missing=1; fi
          done
          exit "$missing"

      - name: Apply new migrations to production
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --remote --yes
      - name: Fail if production has drifted from the migrations
        run: |
          diff="$(npx supabase db diff --remote --schema public)"
          if [ -n "$diff" ]; then echo "$diff"; exit 1; fi

      - run: npx vercel@65.11.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx vercel@65.11.0 build --prod --token "$VERCEL_TOKEN"
      - run: npx vercel@65.11.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Smoke-test the public URL
        id: smoke
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Show the site's server errors
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          host="$(echo "$SMOKE_URL" | sed -E 's#https?://##; s#/.*##')"
          api="https://api.vercel.com"
          id="$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r '.id')"
          errors=""
          # The log stream sometimes returns nothing at first, so try a few times.
          for attempt in 1 2 3; do
            (sleep 5; curl -s -o /dev/null "$SMOKE_URL"; sleep 3; curl -s -o /dev/null "$SMOKE_URL") &
            errors="$(curl -s -m 25 -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v1/projects/$VERCEL_PROJECT_ID/deployments/$id/runtime-logs?teamId=$VERCEL_ORG_ID"               | jq -Rr 'fromjson? | select(.level == "error") | .message' | cut -c1-400 | sort -u || true)"
            wait
            if [ -n "$errors" ]; then break; fi
          done
          echo "${errors:-No server errors could be read. This doesn't prove there were none, so check Logs in Vercel.}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
